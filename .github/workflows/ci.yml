name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest

    services:
      # Same image the stack runs, so pg_trgm and PostGIS behave here exactly
      # as they do in production — the search assertions depend on the
      # version's word-similarity semantics, not just on our SQL.
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: addresses
          POSTGRES_PASSWORD: postgis
          POSTGRES_DB: addresses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addresses -d addresses_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_PG_CONN: "host=localhost port=5432 user=addresses password=postgis dbname=addresses_test"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches api/Dockerfile.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Run tests
        run: pytest -v

  build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Catches a broken Dockerfile or an unresolvable pin without waiting for
      # someone to deploy. Images are not pushed anywhere.
      - name: Build images
        run: docker compose -f compose.production.yaml build addresses_api addresses_importer
