services:
  postgis:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-addresses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgis}
      POSTGRES_DB:       ${POSTGRES_DB:-addresses}
      # Used by db/init/01-api-role.sh on first init; safe to leave unset.
      API_DB_USER:       ${API_DB_USER:-addresses_api}
      API_DB_PASSWORD:   ${API_DB_PASSWORD:-}
    volumes:
      - postgis_data:/var/lib/postgresql
      # Init scripts run only when the data directory is empty (first start).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Uncomment to expose the DB to the host (psql, DBeaver, QGIS, …):
    # ports:
    #   - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-addresses} -d ${POSTGRES_DB:-addresses}
      interval: 10s
      timeout: 5s
      retries: 10

  addresses_importer:
    build:
      context: .
      dockerfile: importer/Dockerfile
    image: geo-addresses-importer
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      # Compose constructs the libpq connection string from POSTGRES_* in .env,
      # so credentials only have to be defined once.
      PG_CONN_ADDRESSES: "host=postgis user=${POSTGRES_USER:-addresses} dbname=${POSTGRES_DB:-addresses} password=${POSTGRES_PASSWORD:-postgis}"
      # Scheduler config — see importer/scheduler.py for details.
      # Default: 5th of every month at 03:00 (gives CUZK a margin to publish
      # the monthly RUIAN dump, which lands ~1st-3rd of each month).
      SCHEDULE_DAY:    "${SCHEDULE_DAY:-5}"
      SCHEDULE_HOUR:   "${SCHEDULE_HOUR:-3}"
      SCHEDULE_MINUTE: "${SCHEDULE_MINUTE:-0}"
      # Set to "1" only for first-time bootstrap; otherwise restarts would
      # trigger an unneeded full re-import every time.
      RUN_ON_START:    "${RUN_ON_START:-0}"
      # Parallel COPY workers in the CZ importer (one CSV file per worker).
      RUIAN_WORKERS:   "${RUIAN_WORKERS:-4}"

  addresses_api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: geo-addresses-api
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      # Read-only role created by db/init/01-api-role.sh.
      PG_CONN_API: "host=postgis user=${API_DB_USER:-addresses_api} dbname=${POSTGRES_DB:-addresses} password=${API_DB_PASSWORD:-apipassword}"
      # Comma-separated allowlist of API keys checked against the X-API-Key
      # header. Empty = open access (dev). Set to a real list in production.
      API_KEYS:      "${API_KEYS:-}"
      API_PORT:      "${API_PORT:-8000}"
      PG_POOL_MIN:   "${PG_POOL_MIN:-2}"
      PG_POOL_MAX:   "${PG_POOL_MAX:-10}"
      CACHE_MAX_AGE: "${CACHE_MAX_AGE:-3600}"
    # The API is reachable from Caddy via the internal compose network at
    # http://addresses_api:${API_PORT:-8000}. The port is intentionally
    # NOT published to the host — all external traffic should go through
    # Caddy on 80/443 so HTTPS / API-key auth / future rate-limiting can't
    # be bypassed. Uncomment to expose direct HTTP for debugging:
    # ports:
    #   - "${API_PORT:-8000}:${API_PORT:-8000}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - addresses_api
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      API_PORT:    ${API_PORT:-8000}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  postgis_data:
  caddy_data:

# One-shot manual runs (bypassing the scheduler):
#   docker compose -f compose.production.yaml run --rm addresses_importer python3 -m importer.import_cz_csv
#   docker compose -f compose.production.yaml run --rm addresses_importer python3 -m importer.import_hr_wfs
#
# API docs are auto-served by FastAPI:
#   http://localhost:8000/docs       (Swagger UI)
#   http://localhost:8000/openapi.json
